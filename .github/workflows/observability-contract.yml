name: Observability contract

on:
  push:
    paths:
      - '.github/workflows/observability-contract.yml'
      - 'external/**'
      - 'examples/observability/**'
      - 'cli/**'
      - 'go.mod'
      - 'go.sum'
      - 'browser/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.browser.json'
      - 'vitest.browser.config.ts'
  pull_request:
    paths:
      - '.github/workflows/observability-contract.yml'
      - 'external/**'
      - 'examples/observability/**'
      - 'cli/**'
      - 'go.mod'
      - 'go.sum'
      - 'browser/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.browser.json'
      - 'vitest.browser.config.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the pinned browser serializer contract
        run: npm ci --prefix external/observability/testdata/browser --ignore-scripts
      - name: Pull the pinned contract Collector
        run: docker pull otel/opentelemetry-collector-contrib:0.160.0
      - name: Pull pinned queue initializer and rule checker
        run: |
          docker pull busybox:1.37.0
          docker pull prom/prometheus:v3.5.0
      - name: Check telemetry, CLI, and reference contracts with the race detector
        env:
          GHATD_TEST_COLLECTOR: '1'
        run: go test -race -count=1 ./external/observability/... ./external/http/server/... ./external/emailprovider/... ./cli/cmd/... ./examples/observability/...
      - name: Check shared verification and reference smoke assertions
        run: |
          python3 -m venv "$RUNNER_TEMP/observability-verify"
          "$RUNNER_TEMP/observability-verify/bin/python" -m pip install PyYAML==6.0.3
          "$RUNNER_TEMP/observability-verify/bin/python" -m unittest discover -s external/observability/verify/python -p 'test_*.py'
          python3 -m unittest discover -s examples/observability -p 'test_*.py'
      - name: Validate Collector configuration and alert behavior
        run: |
          python3 examples/observability/collector/test_config.py
          python3 examples/observability/collector/test_alerts.py

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - name: Check distributable contents
        run: npm pack --dry-run --ignore-scripts
