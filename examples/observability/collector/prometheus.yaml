global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yaml
scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]
# Connect this independent scraper to your Alertmanager for notifications.
# Selfmetrics exported through the Collector's OTLP queue are not independent.
